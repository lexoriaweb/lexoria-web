            <p>Leht ei kasuta analüütikat, reklaami ega jälgimisküpsiseid. Valikute meelespidamiseks salvestatakse sinu brauseri kohalikku mällu valitud keel (lex_lang). Seda ei saadeta meile ja saad selle eemaldada, kustutades brauseri seadetes selle lehe andmed.</p>`
        },
        terms: {
          tab: 'Tingimused', title: 'Kasutus<em>tingimused</em>',
          body: (lang) => `
            <h3>1. Lehe sisu</h3>
            <p>Lehe sisu on üldine teave büroo ja selle teenuste kohta. See ei ole õigusnõu ega asenda asjatundja hinnangut konkreetses asjas.</p>
            <h3>2. Kliendisuhe</h3>
            <p>Ühenduse võtmine vormi, e-posti või telefoni teel ei tekita veel kliendisuhet. Kliendisuhe algab siis, kui selles on eraldi kokku lepitud.</p>
            <h3>3. Hinnad</h3>
            <p>Lehel toodud hinnad on tunnihinnad ja alghinnad. Lõplik tasu sõltub töö mahust.</p>
            <h3>4. Dokumendipank</h3>
            <p>Dokumendipanga ostudele kohalduvad <a href="${SHOP_TERMS[lang]}">dokumendipanga müügitingimused</a>.</p>
            <h3>5. Autoriõigus</h3>
            <p>Lehe tekstid, pildid ja kujundus kuuluvad Asianajotoimisto Lexoria Oy-le või tema partneritele. Neid ei tohi loata kopeerida ega avaldada.</p>
            <h3>6. Kohalduv õigus</h3>
            <p>Lehele ja nendele tingimustele kohaldub Soome õigus.</p>`
        }
      }
    }
  };

  function applyLang(lang) {
    if (!I18N[lang]) lang = 'en';
    const t = I18N[lang];
    document.documentElement.lang = lang;
    document.title = t.title;
    document.querySelectorAll('[data-t]').forEach(el => { el.textContent = t[el.dataset.t]; });
    const ids = Object.keys(t.docs);
    document.getElementById('index').innerHTML = ids.map(id => `<a href="#${id}">${t.docs[id].tab}</a>`).join('');
    document.getElementById('docs').innerHTML = ids.map(id => {
      const d = t.docs[id];
      return `<section class="doc" id="${id}"><h1>${d.title}</h1><div class="doc-body">${typeof d.body === 'function' ? d.body(lang) : d.body}</div></section>`;
    }).join('');
    document.querySelectorAll('[data-lang]').forEach(btn => btn.classList.toggle('active', btn.dataset.lang === lang));
  }

  document.querySelectorAll('[data-lang]').forEach(btn => {
    btn.addEventListener('click', () => {
      try { localStorage.setItem('lex_lang', btn.dataset.lang); } catch(e){}
      applyLang(btn.dataset.lang);
    });
  });
  applyLang(document.documentElement.lang);

  // Sections are rendered after load, so the browser's own jump to the hash finds nothing
  const target = location.hash && document.getElementById(location.hash.slice(1));
  if (target) target.scrollIntoView({ behavior: 'instant' });

  // Local preview: when opened as a file, links point at the sibling local HTML.
  if (location.protocol === 'file:') {
    document.querySelectorAll('[data-home]').forEach(a => { a.href = 'index.html'; });
  }
</script>
</body>
</html>
